env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "./tmp"

[build]
args_bin = []
bin = "./tmp/look-news"
cmd = "go build -o ./tmp/look-news ./cmd/look-news"
delay = 800
entrypoint = ["./tmp/look-news"]
exclude_dir = [".git", ".idea", ".junie", "tmp", "vendor", "testdata"]
exclude_file = [".DS_Store"]
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
ignore_dangerous_root_dir = false
include_dir = ["cmd", "internal"]
include_ext = ["go", "png"]
include_file = [".air.toml", "FyneApp.toml", "cmd/look-news/FyneApp.toml", "go.mod", "go.sum"]
kill_delay = "0s"
log = "air-build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = "cyan"
build = "yellow"
main = "magenta"
mode = "auto"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true