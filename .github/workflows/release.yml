name: Release macOS

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'

permissions:
  contents: write

jobs:
  package-and-release:
    name: Package and publish macOS app
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package app
        working-directory: cmd/look-news
        run: fyne package -release

      - name: Archive app and calculate checksum
        working-directory: cmd/look-news
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="Look-News-${RELEASE_TAG}-macOS-$(uname -m).zip"
          mkdir -p ../../dist
          ditto -c -k --sequesterRsrc --keepParent "Look News.app" "../../dist/${archive}"
          (cd ../../dist && shasum -a 256 "${archive}" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Look News ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt