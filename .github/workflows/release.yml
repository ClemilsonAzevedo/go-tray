name: Release macOS

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package app and verify architecture
        working-directory: cmd/look-news
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          fyne package -release
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "Look News.app/Contents/Info.plist")
          binary="Look News.app/Contents/MacOS/${executable}"
          architectures=$(lipo -archs "$binary")
          if ! grep -Eq "(^|[[:space:]])${EXPECTED_ARCH}([[:space:]]|$)" <<< "$architectures"; then
            echo "Expected ${EXPECTED_ARCH} executable, found: ${architectures}" >&2
            exit 1
          fi

      - name: Create ZIP and DMG packages
        working-directory: cmd/look-news
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../../dist
          archive="Look-News-${RELEASE_TAG}-macOS-${ARCH}.zip"
          disk_image="Look-News-${RELEASE_TAG}-macOS-${ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "Look News.app" "../../dist/${archive}"
          hdiutil create -volname "Look News" -srcfolder "Look News.app" -ov -format UDZO "../../dist/${disk_image}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum *.zip *.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Look News ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt